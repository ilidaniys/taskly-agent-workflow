name: PR unit-test agent

# Four jobs with separated privileges:
#   gate    – deterministic: is there anything testable in this diff?            (no secrets, read-only)
#   agent   – planner (sonnet) then writer (haiku); emits patch + plan + report    (LLM credential, read-only token)
#   verify  – guards and re-runs the patch from scratch                           (no secrets, read-only)
#   publish – commits the verified patch and comments on the PR                   (write token)
# verify and publish run the guard scripts from the BASE branch, so a pull request cannot
# weaken the guard that judges it. The workflow file itself still comes from the PR (GitHub
# semantics for `pull_request`); CODEOWNERS on .github/ closes that for collaborators.
# See SOLUTION.md for the reasoning.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: unit-test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CLAUDE_CODE_VERSION: '2.1.295'
  PLANNER_BUDGET_USD: '1'
  WRITER_BUDGET_USD: '2.5'

jobs:
  gate:
    name: Gate
    # Fork pull requests never receive secrets on `pull_request`; skip them explicitly
    # instead of failing. `pull_request_target` is deliberately not used.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      testable: ${{ steps.units.outputs.testable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: List testable changed units
        id: units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          node .claude/skills/analyze-pr-changes/scripts/changed-units.mjs > "$RUNNER_TEMP/gate/units.json"
          testable="$(jq -r '.summary.testable' "$RUNNER_TEMP/gate/units.json")"
          # Never react to the agent's own commit (defence in depth: pushes made with
          # GITHUB_TOKEN do not trigger workflows in the first place).
          if git log -1 --format=%B | grep -q '^Unit-Test-Agent: '; then testable=0; fi
          echo "testable=$testable" >> "$GITHUB_OUTPUT"
          jq '{summary, units: [.units[] | {path, status, test_exists}]}' "$RUNNER_TEMP/gate/units.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-agent-gate
          path: ${{ runner.temp }}/gate/units.json
          retention-days: 7

  agent:
    name: Agent
    needs: gate
    if: needs.gate.outputs.testable != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The LLM credential lives in the "prod" Environment (Settings → Environments); only this job gets it.
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # Install scripts of the PR's dependencies run here, before any credential exists in the job.
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      # Measures current coverage for the planner. Runs the suites of the checked-out tree, so it
      # happens here, before any credential exists in the job. Never fails the job.
      - name: Coverage snapshot (no secrets)
        run: node .claude/skills/analyze-pr-changes/scripts/coverage-snapshot.mjs || echo "::warning::coverage snapshot failed; the planner runs without it"
      - name: Install sandbox dependencies
        run: |
          # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB forces Claude Code's Linux subprocess sandbox
          # (bubblewrap) on; it refuses to start without bwrap + socat and user namespaces.
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Run planner and writer agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Strip the credential from every subprocess the agents start (tests included).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          DISABLE_AUTOUPDATER: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MODE: pr
          OUT_DIR: ${{ runner.temp }}/agent-output
        run: bash .github/unit-test-agent/run-agents.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-test-agent-output
          path: ${{ runner.temp }}/agent-output
          retention-days: 7

  verify:
    name: Verify
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      patch_empty: ${{ steps.patch.outputs.empty }}
    steps:
      # Guard scripts come from the base branch (see header). Checked out first, copied
      # aside, then the pull request replaces the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/unit-test-agent
          persist-credentials: false
      - name: Keep the base branch's guard scripts
        id: guard_dir
        run: |
          mkdir -p "$RUNNER_TEMP/guard"
          if [ -f .github/unit-test-agent/apply-patch.mjs ]; then
            cp .github/unit-test-agent/*.mjs "$RUNNER_TEMP/guard/"
            echo "dir=$RUNNER_TEMP/guard" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base branch has no .github/unit-test-agent yet; using the pull request's scripts."
            echo "dir=$GITHUB_WORKSPACE/.github/unit-test-agent" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-agent-output
          path: ${{ runner.temp }}/agent-output
      - name: Is there a patch?
        id: patch
        run: |
          if [ -s "$RUNNER_TEMP/agent-output/tests.patch" ]; then echo "empty=false" >> "$GITHUB_OUTPUT"; else echo "empty=true" >> "$GITHUB_OUTPUT"; fi
          mkdir -p "$RUNNER_TEMP/verify"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.patch.outputs.empty == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        if: steps.patch.outputs.empty == 'false'
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Baseline (pull request as submitted)
        if: steps.patch.outputs.empty == 'false'
        env:
          GUARD: ${{ steps.guard_dir.outputs.dir }}
        run: node "$GUARD/verify.mjs" run before "$RUNNER_TEMP/verify"
      - name: Guard and apply the agent's patch
        id: guard
        if: steps.patch.outputs.empty == 'false'
        continue-on-error: true
        env:
          GUARD: ${{ steps.guard_dir.outputs.dir }}
        run: node "$GUARD/apply-patch.mjs" "$RUNNER_TEMP/agent-output/tests.patch" "$RUNNER_TEMP/verify/patch.json"
      - name: Re-run with the agent's tests
        if: steps.patch.outputs.empty == 'false' && steps.guard.outcome == 'success'
        env:
          GUARD: ${{ steps.guard_dir.outputs.dir }}
        run: node "$GUARD/verify.mjs" run after "$RUNNER_TEMP/verify"
      - name: Verdict
        if: steps.patch.outputs.empty == 'false'
        env:
          GUARD: ${{ steps.guard_dir.outputs.dir }}
        run: node "$GUARD/verify.mjs" verdict "$RUNNER_TEMP/verify"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.patch.outputs.empty == 'false'
        with:
          name: unit-test-agent-verify
          path: ${{ runner.temp }}/verify
          retention-days: 7

  publish:
    name: Publish
    needs: [gate, agent, verify]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job holds the write token. It installs nothing and runs no test code; the only
      # scripts it executes (guard, comment renderer) are taken from the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/unit-test-agent
          persist-credentials: false
      - name: Keep the base branch's guard scripts
        id: guard_dir
        run: |
          mkdir -p "$RUNNER_TEMP/guard"
          if [ -f .github/unit-test-agent/apply-patch.mjs ]; then
            cp .github/unit-test-agent/*.mjs "$RUNNER_TEMP/guard/"
            echo "dir=$RUNNER_TEMP/guard" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base branch has no .github/unit-test-agent yet; using the pull request's scripts."
            echo "dir=$GITHUB_WORKSPACE/.github/unit-test-agent" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-test-agent-*
          path: ${{ runner.temp }}/artifacts
      - name: Commit verified tests to the pull-request branch
        id: push
        if: needs.verify.result == 'success' && needs.verify.outputs.patch_empty == 'false'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GUARD: ${{ steps.guard_dir.outputs.dir }}
        run: |
          set -euo pipefail
          node "$GUARD/apply-patch.mjs" "$RUNNER_TEMP/artifacts/unit-test-agent-output/tests.patch" > /dev/null
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet \
              -m 'test: add unit tests for changed code' \
              -m "Unit-Test-Agent: verified in run ${GITHUB_RUN_ID}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git push --quiet origin "HEAD:refs/heads/${HEAD_REF}"; then
            echo "outcome=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=stale" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD: ${{ steps.guard_dir.outputs.dir }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_TESTABLE: ${{ needs.gate.outputs.testable }}
          AGENT_RESULT: ${{ needs.agent.result }}
          PATCH_EMPTY: ${{ needs.verify.outputs.patch_empty }}
          PUSH_OUTCOME: ${{ steps.push.outputs.outcome }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node "$GUARD/render-comment.mjs" "$RUNNER_TEMP/artifacts" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- unit-test-agent -->"))) | .id' | tail -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${RUNNER_TEMP}/comment.md" > /dev/null
          fi
